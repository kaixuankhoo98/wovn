<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Weave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <h1 class="mark">Weave</h1>
        <label class="picker">
          <span class="sr-only">Puzzle</span>
          <select id="picker"></select>
        </label>
      </header>

      <main>
        <p id="meta" class="meta"></p>
        <div id="board" class="board"></div>
        <p id="status" class="status" aria-live="polite"></p>
        <div class="controls">
          <button id="undo" type="button">Undo</button>
          <button id="reset" type="button">Reset</button>
          <button id="next" type="button" class="primary" hidden>Next puzzle</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
